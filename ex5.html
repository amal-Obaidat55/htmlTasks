<!DOCTYPE html>

<body>
    <h1>Images in Table</h1>
    <span>__________________________________________________________________________________________________________________</span>
    <h3>What are your favorite pets ?</h3>
    <table border="1">
        <tr>
            <th>Pet Image</th>
            <th>More Facts about(as a Link)</th>
        </tr>
         <tr>
            <td><img src="images/horse.jpg" alt="horse picture " width="100" height="100"></td>
            <td><a href="https://en.wikipedia.org/wiki/Horse">Horse</a></td>
        </tr>
         <tr>
            <td><img src="images/dog.jpg" alt="dog picture" width="100" height="100"></td>
            <td><a href="https://en.wikipedia.org/wiki/Dog">Dog</a></td>
        </tr>
         <tr>
            <td><img src="images/cat.jpg" alt="cat picture" width="100" height="100"></td>
            <td><a href="https://en.wikipedia.org/wiki/Cat">Cat</a></td>
        </tr>
    </table>
</body>
</html>
